services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before running docker compose}
    container_name: personalized-video-backend
    restart: unless-stopped
    shm_size: 2gb
    env_file:
      - ./.env
    environment:
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      CPAAS_API_BASE_URL: ${CPAAS_API_BASE_URL:?Set CPAAS_API_BASE_URL in .env}
    expose:
      - "8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output

  worker:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE before running docker compose}
    container_name: personalized-video-worker
    restart: unless-stopped
    shm_size: 2gb
    env_file:
      - ./.env
    environment:
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      CPAAS_API_BASE_URL: ${CPAAS_API_BASE_URL:?Set CPAAS_API_BASE_URL in .env}
      REMOTION_RENDER_BACKEND: ${REMOTION_RENDER_BACKEND:-service}
      REMOTION_RENDERER_URL: ${REMOTION_RENDERER_URL:-http://remotion-renderer:3000}
    command: python -m app.workers.job_worker
    depends_on:
      backend:
        condition: service_started
      remotion-renderer:
        condition: service_healthy
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./Remotion/public:/app/Remotion/public

  remotion-renderer:
    image: ${RENDERER_IMAGE:?Set RENDERER_IMAGE before running docker compose}
    container_name: personalized-video-remotion-renderer
    restart: unless-stopped
    shm_size: 2gb
    expose:
      - "3000"
    environment:
      REMOTION_RENDER_CONCURRENCY: ${REMOTION_RENDER_CONCURRENCY:-1}
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
      REMOTION_LOG_LEVEL: ${REMOTION_LOG_LEVEL:-info}
    volumes:
      - ./output:/app/output
      - ./Remotion/public:/app/Remotion/public
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE before running docker compose}
    container_name: personalized-video-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
