services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalized-video-backend
    restart: unless-stopped
    shm_size: 2gb
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalized-video-worker
    restart: unless-stopped
    env_file:
      - ./.env
    command: python -m app.workers.avatar_job_worker
    depends_on:
      - backend
    volumes:
      - ./input:/app/input
      - ./output:/app/output

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://13.127.221.158:8000
    container_name: personalized-video-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "8080:80"
